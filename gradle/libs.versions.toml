[versions]
# libraries
junit = "4.13.2"
report = "1.0-SNAPSHOT"
mockito = "5.23.0"
antlr4IntellijAdaptor = "0.2-SNAPSHOT"

# plugins — 2.10+ needs Gradle 8.13; 2.12+ needs Gradle 9. Stay on 2.9.x with Gradle 8.11.1
changelog = "2.5.0"
intelliJPlatform = "2.9.0"
kotlin = "2.3.21"
kover = "0.9.9"
qodana = "2026.1.3"


[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
report = { group = "com.github", name = "report-issue", version.ref = "report" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
antlr4IntellijAdaptor = { group = "org.antlr", name = "antlr4-intellij-adaptor", version.ref = "antlr4IntellijAdaptor" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
