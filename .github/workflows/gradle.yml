# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI

on: [ push, pull_request ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platformVersion: "2023.1"
            pluginSinceBuild: "222.3345.18"
            pluginUntilBuild: "231.*"
          - platformVersion: "2023.3"
            pluginSinceBuild: "233"
            pluginUntilBuild: "233.*"
          - platformVersion: "2024.1"
            pluginSinceBuild: "241"
            pluginUntilBuild: "241.*"
          - platformVersion: "2024.3"
            pluginSinceBuild: "243"
            pluginUntilBuild: "243.*"
          - platformVersion: "2025.1"
            pluginSinceBuild: "251"
            pluginUntilBuild: "251.*"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: |
          ./gradlew check buildPlugin \
            -PplatformVersion=${{ matrix.platformVersion }} \
            -PpluginSinceBuild=${{ matrix.pluginSinceBuild }} \
            -PpluginUntilBuild=${{ matrix.pluginUntilBuild }}
      - name: Archive distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: "antlr-intellij-development-${{ matrix.platformVersion }}"
          path: build/distributions/*.zip
        if: matrix.platformVersion == '2023.1'
